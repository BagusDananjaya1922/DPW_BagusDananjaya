<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Tutorial CSS Framework</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .hero {
      background: linear-gradient(to right, #198754, #20c997);
      color: white;
      padding: 70px 20px;
      border-radius: 0 0 20px 20px;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #198754;
    }

    .btn-custom {
      background-color: #198754;
      border: none;
      padding: 10px 20px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background-color: #157347;
    }

    footer {
      font-size: 14px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">MyWebsite</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero text-center">
  <div class="container">
    <h1 class="fw-bold">Contact Us</h1>
    <p class="lead">Silakan hubungi kami melalui form di bawah ini</p>
    <p class="mb-0">Nama: Bagus Dananjaya | NIM: 253307045</p>
  </div>
</section>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="form-container">

        <h4 class="mb-4 fw-bold text-center">Kirim Pesan</h4>

        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="name" placeholder="Masukkan nama..." required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Alamat Email</label>
            <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Pesan</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Tulis pesan anda..." required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-custom">Kirim Pesan</button>
          </div>
        </form>

      </div>

    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <div class="container">
    <p class="mb-1">&copy; 2026 Tutorial CSS Framework</p>
    <small>Nama: Bagus Dananjaya | NIM: 253307045</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
