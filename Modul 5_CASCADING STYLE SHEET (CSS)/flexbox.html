<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>
    <style>
        body {
            font-family: Arial;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
        }

        .item {
            width: 200px;
            background-color: #2196F3;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .item img {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="item">
        <img src="gambar/hitam.jpg">
        <p>Item 1</p>
    </div>
    <div class="item">
        <img src="gambar/biru.jpg">
        <p>Item 2</p>
    </div>
    <div class="item">
        <img src="gambar/pink.jpg">
        <p>Item 3</p>
    </div>
</div>

<p>Kesimpulan: Flexbox memudahkan pengaturan posisi elemen secara fleksibel.</p>

</body>
</html>
