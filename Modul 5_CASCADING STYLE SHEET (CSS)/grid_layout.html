<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 10px;
            padding: 20px;
            background-color: #2196F3;
        }

        .item {
            background-color: white;
            text-align: center;
            padding: 20px;
        }

        .item img {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="grid">
    <div class="item"><img src="gambar/17e.jpg"><p>1</p></div>
    <div class="item"><img src="gambar/17.jpg"><p>2</p></div>
    <div class="item"><img src="gambar/air.jpg"><p>3</p></div>
    <div class="item"><p>4</p></div>
    <div class="item"><p>5</p></div>
    <div class="item"><p>6</p></div>
</div>

<p>Kesimpulan: Grid digunakan untuk membuat layout berbasis baris dan kolom.</p>

</body>
</html>
