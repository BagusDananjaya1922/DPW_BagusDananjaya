<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Menu jQuery UI</title>

    <!-- CSS jQuery UI -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

    <!-- Library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        #menuUtama {
            width: 220px;
        }

        h3 {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<h3>Menu Navigasi</h3>

<ul id="menuUtama">
    <li><div>Home</div></li>

    <li>
        <div>Produk</div>
        <ul>
            <li><div>Gadget</div></li>
            <li><div>Fashion</div></li>
            <li><div>Kendaraan</div></li>
        </ul>
    </li>

    <li><div>Hubungi Kami</div></li>

    <li class="ui-state-disabled">
        <div>Fitur Segera Tersedia</div>
    </li>
</ul>

<script>
    $(document).ready(function () {
        // aktifkan menu
        $("#menuUtama").menu();
    });
</script>

</body>
</html>
