<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Verifikasi Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        .card {
            display: inline-block;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input {
            margin-top: 8px;
            padding: 5px;
        }

        button {
            margin-top: 12px;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <h3>Cek Password</h3>

    <form name="formPassword">
        Password Baru:<br>
        <input type="password" name="pass1"><br>

        Ulangi Password:<br>
        <input type="password" name="pass2"><br>

        <button type="button" onclick="cekPass()">Proses</button>
    </form>
</div>

<script>
    function cekPass() {
        let p1 = document.formPassword.pass1.value;
        let p2 = document.formPassword.pass2.value;

        if (p1 !== p2) {
            alert("Password tidak cocok!");
        } else {
            window.location.href = "alert.html";
        }
    }
</script>

</body>
</html>
