<body>

<div class="form-box">
    <h3>Form Input Nama</h3>

    <form name="dataForm">
        Nama:<br>
        <input type="text" name="namaUser"><br><br>
        <button type="button" onclick="validasi(this.form)">Kirim</button>
    </form>
</div>

<script>
    function validasi(form) {
        let isi = form.namaUser.value;

        if (isi === "") {
            alert("Nama tidak boleh kosong!");
            form.namaUser.focus();
            return false;
        } else {
            alert("Terima kasih, " + isi);
            return true;
        }
    }
</script>
