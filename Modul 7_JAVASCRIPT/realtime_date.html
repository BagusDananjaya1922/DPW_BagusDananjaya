<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jam Digital</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background-color: #f5f5f5;
        }

        .jam-box {
            display: inline-block;
            padding: 20px 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        #waktu {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="jam-box">
    <h3>Waktu Sekarang</h3>
    <div id="waktu"></div>
</div>

<script>
    function updateWaktu() {
        let tgl = new Date();
        let tampil = tgl.toLocaleString('id-ID');

        document.getElementById("waktu").innerHTML = tampil;
    }

    // jalankan pertama kali
    updateWaktu();

    // update tiap 1 detik
    setInterval(updateWaktu, 1000);
</script>

</body>
</html>
